[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clemagents"
version = "0.1.0"
description = "Evaluate agent harnesses on clembench games through a pipeline built on clemcore"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "clemcore==3.7.2",
    "fastmcp==3.3.1",
    "mcp==1.26.0",
    "openenv-core==0.2.3",
    "gymnasium>=1.2,<2",
    "pettingzoo>=1.25,<2",
    "requests>=2.32,<3",
    "urllib3>=2,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.30,<1",
    "datasets>=4.4,<5",
    "pandas>=2.3,<3",
    "tqdm>=4.65,<5",
    "claude-agent-sdk==0.2.87",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
agentclem = "clemagents.run_pipeline.run_pipeline:main"
agentclem-transcribe = "clemagents.transcribe_agent_loop.transcribe_agent_loop:main"

[project.urls]
Repository = "https://github.com/TimLeiber/IMClemAgents"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clemagents = ["adapters/utils/*.yaml", "mcp/*.yaml", "docker/agent-sandbox/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
